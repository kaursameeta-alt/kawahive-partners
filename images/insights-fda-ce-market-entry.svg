<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Test APAC demand before regulatory clearance</title>
<desc id="desc">KawaHive illustration showing a medical device, hospital demand signals and a market-entry decision while FDA clearance or CE marking is pending.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1f3a"/><stop offset="1" stop-color="#16385a"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d998"/><stop offset="1" stop-color="#d6b66b"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/><circle cx="1040" cy="100" r="220" fill="none" stroke="#d6b66b" stroke-opacity=".16" stroke-width="2"/><circle cx="1040" cy="100" r="160" fill="none" stroke="#d6b66b" stroke-opacity=".12" stroke-width="2"/>
<g font-family="Inter,Arial,sans-serif"><text x="78" y="78" font-size="19" font-weight="800" letter-spacing="4" fill="#d6b66b">KAWAHIVE &amp; PARTNERS</text><text x="78" y="168" font-size="47" font-weight="800" fill="#fff">Regulatory clearance</text><text x="78" y="225" font-size="47" font-weight="800" fill="#fff">is not market demand.</text><text x="80" y="282" font-size="24" fill="#dce4ef">Test hospital need and buying readiness</text><text x="80" y="316" font-size="24" fill="#dce4ef">before your next regulatory milestone.</text>
<rect x="80" y="370" width="530" height="124" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".2"/><text x="108" y="410" font-size="18" font-weight="700" fill="#d6b66b">WHILE FDA OR CE IS PENDING</text><text x="108" y="448" font-size="20" fill="#fff">Clinical need · Budget · Buying process</text><text x="108" y="477" font-size="20" fill="#fff">Competition · Channel capability</text>
<g transform="translate(760 160)"><rect x="0" y="0" width="330" height="320" rx="22" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".22"/><rect x="70" y="35" width="190" height="120" rx="14" fill="#fff" fill-opacity=".08" stroke="#dce4ef" stroke-opacity=".55" stroke-width="3"/><rect x="95" y="57" width="140" height="12" rx="6" fill="#d6b66b"/><rect x="95" y="81" width="94" height="9" rx="4" fill="#dce4ef" fill-opacity=".65"/><rect x="95" y="101" width="118" height="9" rx="4" fill="#dce4ef" fill-opacity=".4"/><circle cx="165" cy="205" r="44" fill="url(#gold)"/><path d="M165 181v48M141 205h48" stroke="#0b1f3a" stroke-width="12" stroke-linecap="round"/><path d="M45 278h240" stroke="#d6b66b" stroke-opacity=".65" stroke-width="3"/><text x="165" y="307" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Demand evidence first</text></g>
<text x="80" y="570" font-size="18" fill="#c4d0df">A practical framework for MedTech and medical device founders</text></g></svg>