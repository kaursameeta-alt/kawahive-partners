<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Medical device distributor risk assessment</title>
<desc id="desc">KawaHive illustration showing a medical device manufacturer assessing customer visibility, installed-base certainty, service continuity and revenue risk before a distributor transition.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f3a"/><stop offset="1" stop-color="#16385a"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d998"/><stop offset="1" stop-color="#d6b66b"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/><circle cx="1030" cy="110" r="220" fill="none" stroke="#d6b66b" stroke-opacity=".18" stroke-width="2"/><circle cx="1030" cy="110" r="165" fill="none" stroke="#d6b66b" stroke-opacity=".12" stroke-width="2"/>
<g font-family="Inter,Arial,sans-serif"><text x="78" y="78" font-size="19" font-weight="800" letter-spacing="4" fill="#d6b66b">KAWAHIVE &amp; PARTNERS</text><text x="78" y="170" font-size="48" font-weight="800" fill="#ffffff">Your medical device</text><text x="78" y="228" font-size="48" font-weight="800" fill="#ffffff">distributor is</text><text x="78" y="286" font-size="48" font-weight="800" fill="#ffffff">underperforming.</text><text x="80" y="337" font-size="24" fill="#dce4ef">Can you protect your customers</text><text x="80" y="371" font-size="24" fill="#dce4ef">and revenue before you decide?</text>
<g transform="translate(730 160)"><rect x="0" y="0" width="375" height="310" rx="22" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22"/><rect x="34" y="34" width="307" height="54" rx="10" fill="#ffffff" fill-opacity=".09"/><circle cx="61" cy="61" r="9" fill="#d6b66b"/><text x="83" y="68" font-size="18" font-weight="700" fill="#ffffff">Distributor risk review</text>
<g transform="translate(35 115)"><rect width="305" height="42" rx="8" fill="#102b49"/><circle cx="22" cy="21" r="10" fill="#d6b66b"/><path d="M17 21l4 4 7-8" fill="none" stroke="#0b1f3a" stroke-width="2.5"/><text x="44" y="27" font-size="17" fill="#ffffff">Customer visibility</text>
<rect y="54" width="305" height="42" rx="8" fill="#102b49"/><circle cx="22" cy="75" r="10" fill="#d6b66b"/><path d="M17 75l4 4 7-8" fill="none" stroke="#0b1f3a" stroke-width="2.5"/><text x="44" y="81" font-size="17" fill="#ffffff">Installed-base certainty</text>
<rect y="108" width="305" height="42" rx="8" fill="#102b49"/><circle cx="22" cy="129" r="10" fill="#d6b66b"/><path d="M17 129l4 4 7-8" fill="none" stroke="#0b1f3a" stroke-width="2.5"/><text x="44" y="135" font-size="17" fill="#ffffff">Service continuity</text>
<rect y="162" width="305" height="42" rx="8" fill="#102b49"/><circle cx="22" cy="183" r="10" fill="#d6b66b"/><path d="M17 183l4 4 7-8" fill="none" stroke="#0b1f3a" stroke-width="2.5"/><text x="44" y="189" font-size="17" fill="#ffffff">Revenue and cash exposure</text></g></g>
<rect x="80" y="425" width="255" height="4" rx="2" fill="url(#gold)"/><text x="80" y="477" font-size="18" font-weight="700" fill="#d6b66b">EVIDENCE BEFORE THE CHANNEL DECISION</text><text x="80" y="565" font-size="17" fill="#c4d0df">A practical framework for MedTech and medical device founders</text></g></svg>